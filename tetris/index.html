<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="left-panel">
      <h1>TETRIS</h1>
      <div class="info-box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="info-box">
        <div class="label">LEVEL</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="info-box">
        <div class="label">LINES</div>
        <div class="value" id="lines">0</div>
      </div>
    </div>

    <div id="board-wrapper">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay" class="hidden">
        <div id="overlay-title"></div>
        <div id="overlay-sub"></div>
        <button id="overlay-btn"></button>
      </div>
    </div>

    <div id="right-panel">
      <div class="info-box">
        <div class="label">NEXT</div>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div id="controls">
        <div class="ctrl-title">CONTROLS</div>
        <div class="ctrl-row"><span class="key">←→</span> Move</div>
        <div class="ctrl-row"><span class="key">↑</span> Rotate</div>
        <div class="ctrl-row"><span class="key">↓</span> Soft drop</div>
        <div class="ctrl-row"><span class="key">Space</span> Hard drop</div>
        <div class="ctrl-row"><span class="key">P</span> Pause</div>
      </div>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
